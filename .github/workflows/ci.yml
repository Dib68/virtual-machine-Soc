name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install pyyaml
      - name: Run test suite
        run: bash tests/run-tests.sh
      - name: ShellCheck (analisi statica degli script)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning -e SC1090,SC1091 $(find provision menu soc-lab tools gui condivisa tests -name '*.sh') *.sh || true
