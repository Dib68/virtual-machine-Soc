# Mini-SIEM — Threat Detection Lab
# Stack: Elasticsearch + Logstash + Kibana + Filebeat + Suricata + Target
#
# Avvio rapido:   docker compose up -d          oppure:  make up
# Tutte le sim.:  make attack-all
# Alert check:    make check
# Kibana:         http://localhost:5601
# Elastic:        http://localhost:9200
# Target SSH:     ssh labuser@localhost -p 2222  (pass: labpass)
# Target HTTP:    http://localhost:8080

services:

  # ── Elasticsearch ──────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: siem-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Logstash (parsing pipeline) ────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.3
    container_name: siem-logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5044:5044"    # Beats input
      - "5000:5000"    # Syslog TCP
      - "5140:5140/udp" # Syslog UDP
    volumes:
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./config/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    restart: unless-stopped

  # ── Kibana (SIEM UI) ───────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: siem-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    volumes:
      - ./config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Filebeat (log shipper) ─────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.14.3
    container_name: siem-filebeat
    user: root
    depends_on:
      - logstash
    volumes:
      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - suricata-logs:/suricata-logs:ro
    command: filebeat -e -strict.perms=false
    restart: unless-stopped

  # ── Suricata (IDS/IPS) ─────────────────────────────────────────
  suricata:
    image: jasonish/suricata:latest
    container_name: siem-suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./config/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./config/suricata/rules:/etc/suricata/rules:ro
      - suricata-logs:/var/log/suricata
    command: -i eth0 --set outputs.1.eve-log.enabled=yes
    restart: unless-stopped

  # ── Kibana Dashboard Loader ────────────────────────────────────
  dashboard-loader:
    image: curlimages/curl:latest
    container_name: siem-dashboard-loader
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - ./config/kibana/dashboards:/dashboards:ro
      - ./scripts/load-dashboards.sh:/load-dashboards.sh:ro
    command: sh /load-dashboards.sh
    restart: no

  # ── Target Machine (vulnerable SSH + HTTP) ────────────────────
  target:
    image: ubuntu:22.04
    container_name: siem-target
    hostname: lab-target
    ports:
      - "2222:22"    # SSH (simulazioni brute force)
      - "8080:80"    # HTTP (simulazioni web attack)
    volumes:
      - ./config/target/setup.sh:/setup.sh:ro
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y -qq openssh-server nginx python3 2>/dev/null &&
        useradd -m -s /bin/bash labuser &&
        echo 'labuser:labpass' | chpasswd &&
        echo 'root:toor' | chpasswd &&
        sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config &&
        sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config &&
        mkdir -p /run/sshd &&
        service ssh start &&
        nginx -g 'daemon off;'
      "
    networks:
      siem-net:
        ipv4_address: 172.20.0.10
    restart: unless-stopped

  # ── Metricbeat (system + Docker metrics) ──────────────────────
  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.14.3
    container_name: siem-metricbeat
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./config/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /:/hostfs:ro
    command: metricbeat -e -strict.perms=false --system.hostfs=/hostfs
    networks:
      - siem-net
    restart: unless-stopped

networks:
  siem-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  es-data:
  suricata-logs:
