metricbeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

metricbeat.modules:

  # ── System metrics (CPU, memory, disk, process) ──────────────
  - module: system
    metricsets:
      - cpu
      - load
      - memory
      - network
      - process
      - process_summary
      - diskio
      - filesystem
    period: 30s
    processes: ['.*']
    process.include_top_n:
      by_cpu: 10
      by_memory: 10
    cpu.metrics: [percentages, normalized_percentages]
    core.metrics: [percentages]

  # ── Docker container metrics ─────────────────────────────────
  - module: docker
    metricsets:
      - container
      - cpu
      - diskio
      - healthcheck
      - memory
      - network
    hosts: ["unix:///var/run/docker.sock"]
    period: 30s

  # ── Elasticsearch cluster monitoring ─────────────────────────
  - module: elasticsearch
    metricsets:
      - node
      - node_stats
      - cluster_stats
      - index
    period: 30s
    hosts: ["http://elasticsearch:9200"]
    xpack.enabled: false

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_docker_metadata: ~
  - drop_fields:
      fields: ["agent.ephemeral_id"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "siem-metrics-%{+YYYY.MM.dd}"

setup.kibana:
  host: "kibana:5601"

setup.dashboards.enabled: false
logging.level: warning
