filebeat.inputs:

  # ── Auth log (SSH brute force detection) ─────────────────
  - type: log
    id: auth-log
    enabled: true
    paths:
      - /host/var/log/auth.log
      - /host/var/log/secure
    fields:
      log_type: auth
    fields_under_root: false
    multiline.pattern: '^\w{3}\s+\d+'
    multiline.negate: true
    multiline.match: after

  # ── Syslog ───────────────────────────────────────────────
  - type: log
    id: syslog
    enabled: true
    paths:
      - /host/var/log/syslog
      - /host/var/log/messages
    fields:
      log_type: syslog

  # ── Suricata EVE-JSON ────────────────────────────────────
  - type: log
    id: suricata-eve
    enabled: true
    paths:
      - /suricata-logs/eve.json
    fields:
      log_type: suricata
    json.keys_under_root: false
    json.add_error_key: true

  # ── Docker container logs ────────────────────────────────
  - type: container
    id: docker-logs
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    fields:
      log_type: docker

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_docker_metadata: ~
  - drop_fields:
      fields: ["host.os.codename"]
      ignore_missing: true

output.logstash:
  hosts: ["logstash:5044"]
  loadbalance: true
  ssl.enabled: false

logging.level: warning
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7

setup.kibana:
  host: "kibana:5601"

setup.dashboards.enabled: false
