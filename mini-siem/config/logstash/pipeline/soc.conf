# ============================================================
#  Logstash Pipeline — Mini-SIEM
#  Input: Filebeat (porta 5044) + Syslog (5000/5140)
#  Parsing: Suricata EVE-JSON, Auth log, Syslog
#  Output: Elasticsearch con indice per tipo di log
# ============================================================

input {
  beats {
    port => 5044
    type => "beats"
  }
  tcp {
    port => 5000
    type => "syslog"
    codec => plain { charset => "UTF-8" }
  }
  udp {
    port => 5140
    type => "syslog"
    codec => plain { charset => "UTF-8" }
  }
}

filter {
  # ── Suricata EVE-JSON ──────────────────────────────────────
  if [fields][log_type] == "suricata" or [type] == "suricata" {
    json { source => "message" target => "suricata" }

    mutate {
      add_field => { "[@metadata][index]" => "suricata" }
      add_field => { "event.module" => "suricata" }
    }

    if [suricata][event_type] == "alert" {
      mutate {
        add_field => { "event.category" => "intrusion_detection" }
        add_field => { "event.kind"     => "alert" }
      }
      # Mappa severity Suricata → livello leggibile
      if [suricata][alert][severity] == 1 {
        mutate { add_field => { "alert.severity_label" => "CRITICAL" } }
      } else if [suricata][alert][severity] == 2 {
        mutate { add_field => { "alert.severity_label" => "HIGH" } }
      } else if [suricata][alert][severity] == 3 {
        mutate { add_field => { "alert.severity_label" => "MEDIUM" } }
      } else {
        mutate { add_field => { "alert.severity_label" => "LOW" } }
      }
    }

    if [suricata][event_type] == "flow" {
      mutate { add_field => { "[@metadata][index]" => "suricata-flow" } }
    }

    date {
      match => ["[suricata][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  # ── Auth log Linux (SSH brute force / login) ───────────────
  if [fields][log_type] == "auth" or [log][file][path] =~ /auth\.log/ {
    grok {
      match => {
        "message" => [
          "%{SYSLOGTIMESTAMP:auth.timestamp} %{HOSTNAME:auth.host} sshd\[%{POSINT:auth.pid}\]: %{DATA:auth.action} %{WORD:auth.method} for %{NOTSPACE:auth.user} from %{IP:source.ip} port %{POSINT:source.port}",
          "%{SYSLOGTIMESTAMP:auth.timestamp} %{HOSTNAME:auth.host} sshd\[%{POSINT:auth.pid}\]: %{DATA:auth.action} for %{NOTSPACE:auth.user} from %{IP:source.ip} port %{POSINT:source.port}",
          "%{SYSLOGTIMESTAMP:auth.timestamp} %{HOSTNAME:auth.host} sshd\[%{POSINT:auth.pid}\]: %{GREEDYDATA:auth.message}"
        ]
      }
    }

    mutate { add_field => { "[@metadata][index]" => "auth" } }

    if [auth.action] =~ /Failed/ {
      mutate {
        add_field => {
          "event.category"    => "authentication"
          "event.outcome"     => "failure"
          "event.kind"        => "event"
          "rule.name"         => "SSH Login Failure"
          "mitre.tactic"      => "Credential Access"
          "mitre.technique"   => "T1110 - Brute Force"
        }
      }
    }
    if [auth.action] =~ /Accepted/ {
      mutate {
        add_field => {
          "event.category"  => "authentication"
          "event.outcome"   => "success"
        }
      }
    }
  }

  # ── Syslog generico ───────────────────────────────────────
  if [type] == "syslog" or [fields][log_type] == "syslog" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:syslog.timestamp} %{HOSTNAME:syslog.host} %{PROG:syslog.program}(?:\[%{POSINT:syslog.pid}\])?: %{GREEDYDATA:syslog.message}"
      }
    }
    mutate { add_field => { "[@metadata][index]" => "syslog" } }
    syslog_pri {}
  }

  # ── Geo-IP arricchimento ──────────────────────────────────
  if [source.ip] {
    geoip {
      source => "source.ip"
      target => "source.geo"
    }
    mutate {
      add_field => { "source.geo.country_code" => "%{[source.geo][country_code2]}" }
    }
  }

  # Rimuovi campi interni Beats
  mutate {
    remove_field => ["agent", "ecs", "host", "input", "log"]
  }
}

output {
  elasticsearch {
    hosts       => ["http://elasticsearch:9200"]
    index       => "siem-%{[@metadata][index]}-%{+YYYY.MM.dd}"
    action      => "index"
  }
  # Debug: decommenta per vedere i log in console
  # stdout { codec => rubydebug }
}
