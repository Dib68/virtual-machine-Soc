<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberSec AI VM — Control Center</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b1020;--bg2:#0e1430;--card:#151d38;--card2:#1b2547;--line:#26315a;
    --txt:#e9edf9;--mut:#94a1c6;--acc:#5b8cff;--acc2:#27e0b0;--danger:#ff5d6c;
    --rad:12px;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,Arial,sans-serif;overflow:hidden}
  a{color:var(--acc);text-decoration:none}
  button{font-family:inherit}
  .app{height:100vh;display:grid;grid-template-columns:248px 1fr}
  /* sidebar */
  .side{background:#0a0f20;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;flex:none}
  .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));
    display:flex;align-items:center;justify-content:center;font-weight:700;color:#08122b}
  .brand b{font-size:15px}.brand small{display:block;font-size:11px;color:var(--mut)}
  .navwrap{flex:1;overflow-y:auto;min-height:0;padding:4px 10px 14px}
  .navh{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#5d6ca0;padding:14px 10px 6px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;
    color:var(--mut);font-size:13.5px;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nv:hover{background:var(--card);color:var(--txt)}
  .nv.on{background:linear-gradient(135deg,rgba(91,140,255,.22),rgba(39,224,176,.15));color:#fff;border-color:var(--line)}
  .nv .d{width:9px;height:9px;border-radius:50%;flex:none}
  .nv .cnt{margin-left:auto;font-size:10.5px;color:var(--mut);background:var(--card2);border-radius:20px;padding:1px 7px}
  /* main */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .top{flex:none;display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);
    background:rgba(11,16,32,.85);backdrop-filter:blur(6px)}
  .mtoggle{display:none;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:9px;
    width:38px;height:38px;font-size:18px;cursor:pointer;flex:none}
  .ttl{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
  .search{flex:1;min-width:120px}
  .search input{width:100%;height:38px;background:var(--card);border:1px solid var(--line);color:var(--txt);
    padding:0 14px;border-radius:10px;font-size:13.5px;outline:none}
  .search input:focus{border-color:var(--acc)}
  .pills{display:flex;gap:7px;flex:none}
  .pill{font-size:11.5px;padding:6px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);
    color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .pdot{width:8px;height:8px;border-radius:50%;background:var(--danger)} .pdot.on{background:var(--acc2)}
  .content{flex:1;overflow-y:auto;min-height:0;padding:18px 20px 40px}
  /* grid + cards (altezza uniforme) */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;
    display:flex;flex-direction:column;min-width:0;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-2px);border-color:var(--acc)}
  .ch{display:flex;align-items:center;gap:10px;margin-bottom:9px;min-width:0}
  .ic{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#08122b;font-size:14px}
  .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .st{font-size:10px;padding:2px 7px;border-radius:20px;flex:none;margin-left:auto}
  .st.ok{background:rgba(39,224,176,.15);color:var(--acc2)} .st.no{background:rgba(255,93,108,.15);color:var(--danger)}
  .ds{font-size:12px;color:var(--mut);line-height:1.45;margin-bottom:11px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
  .row{display:flex;gap:6px;margin-top:auto}
  .btn{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:9px;
    padding:8px 4px;font-size:11.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn:hover{border-color:var(--acc);background:#22305c}
  .btn.go{background:linear-gradient(135deg,var(--acc),#3f6fe0);border:none;color:#fff;font-weight:600}
  .btn.ai{background:linear-gradient(135deg,var(--acc2),#16b894);border:none;color:#06241c;font-weight:600;flex:0 0 46px}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
  .met{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:15px}
  .met .v{font-size:25px;font-weight:700}.met .l{font-size:11.5px;color:var(--mut);margin-top:2px}
  .sec{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 10px}
  .note{font-size:12.5px;color:var(--mut);background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;margin-bottom:14px;line-height:1.5}
  /* chat */
  .chat{display:flex;flex-direction:column;height:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .msgs{flex:1;overflow-y:auto;min-height:0;padding:16px;display:flex;flex-direction:column;gap:11px}
  .m{position:relative;max-width:82%;padding:10px 13px;border-radius:13px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .m mark{background:#ffd479;color:#1a1a1a;border-radius:3px;padding:0 1px}
  .msgcopy{position:absolute;top:4px;right:4px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
    font-size:11px;padding:1px 6px;border-radius:6px;cursor:pointer;opacity:0;transition:opacity .15s}
  .m.a:hover .msgcopy{opacity:.85}
  .chatq{height:30px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:0 10px;outline:none;min-width:160px}
  .btn.fav.on{color:#e8c14a;border-color:#e8c14a}
  .m.u{align-self:flex-end;background:linear-gradient(135deg,var(--acc),#3f6fe0);color:#fff;border-bottom-right-radius:4px}
  .m.a{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .cin{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line);flex:none}
  .cin input{flex:1;height:40px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:0 12px;border-radius:10px;outline:none}
  .cin button{background:linear-gradient(135deg,var(--acc2),#16b894);border:none;color:#06241c;font-weight:700;padding:0 18px;border-radius:10px;cursor:pointer}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(4,8,20,.72);display:none;align-items:center;justify-content:center;padding:22px;z-index:60}
  .ov.show{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;max-width:740px;width:100%;max-height:85vh;display:flex;flex-direction:column}
  .mhd{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
  .mhd b{font-size:15px}.mhd .x{margin-left:auto;cursor:pointer;color:var(--mut);font-size:24px;background:none;border:none;line-height:1}
  .mbody{overflow-y:auto;min-height:0;padding:18px}
  .mbody h1{font-size:19px;margin:12px 0 8px}.mbody h2{font-size:15px;margin:14px 0 6px;color:var(--acc2)}
  .mbody p{font-size:13.5px;color:#cfd6ee;margin:5px 0;line-height:1.6}
  .mbody pre{background:#0a1124;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12.5px;color:#bdf;white-space:pre-wrap;margin:8px 0}
  /* blocchi di codice con pulsante Copia (chat + tutorial) */
  .codewrap{position:relative;margin:8px 0}
  .codewrap pre{margin:0}
  .codewrap .copy{position:absolute;top:6px;right:6px;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;cursor:pointer;opacity:.85}
  .codewrap .copy:hover{opacity:1}
  .m.a pre{background:#0a1124;border:1px solid var(--line);border-radius:9px;padding:10px;overflow:auto;font-size:12px;color:#bdf;margin:0}
  .m.a p{margin:4px 0}.m.a h1{font-size:15px;margin:6px 0}.m.a h2{font-size:14px;margin:6px 0;color:var(--acc2)}
  /* evidenziazione sintassi nei blocchi di codice */
  .c-com{color:#6b7a99;font-style:italic}.c-flag{color:#ffd479}.c-str{color:#7fe3b0}.c-num{color:#e3a0ff}
  /* barra superiore della chat AI: modello, chip rapide, export */
  .airow{display:flex;gap:8px;align-items:center;flex:none;flex-wrap:wrap;margin-bottom:10px}
  .airow select{height:34px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:0 8px;outline:none;cursor:pointer}
  .chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);font-size:11.5px;padding:5px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:var(--acc)}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);
    color:var(--txt);padding:11px 18px;border-radius:11px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
  /* responsive */
  @media(max-width:860px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:50;transform:translateX(-100%);transition:transform .2s}
    .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
    .mtoggle{display:block}
    .pills{display:none}
    .ttl{max-width:40%}
  }
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
  .scrim.show{display:block}
  /* ---- Tema chiaro ---- */
  body.light{--bg:#eef1f7;--bg2:#ffffff;--card:#ffffff;--card2:#eef2fb;--line:#d7deea;--txt:#162033;--mut:#5d6880;
    background:linear-gradient(160deg,#eef1f7,#e7ecf5 60%,#eef1f7)}
  body.light .side{background:#f7f9fd}
  body.light .top{background:rgba(255,255,255,.85)}
  body.light .nv.on{color:#0b1020}
  body.light .modal pre{background:#0e1430;color:#bdf}
  body.light .m.u{color:#fff}
  #theme{cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo"><img src="favicon.png" alt="logo" style="width:26px;height:26px;border-radius:6px" onerror="this.remove();this.parentNode.textContent='CS'"></div><div><b>CyberSec AI</b><small>Control Center</small></div></div>
    <div class="navwrap"><div class="nav" id="nav"></div></div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="mtoggle" id="mtoggle" aria-label="Menu">&#9776;</button>
      <div class="ttl" id="title">Dashboard</div>
      <div class="search"><input id="q" placeholder="Cerca uno strumento..."></div>
      <button class="pill" onclick="showHelp()" title="Scorciatoie e aiuto (?)" aria-label="Aiuto">?</button>
      <button id="theme" class="pill" onclick="toggleTheme()" aria-label="Cambia tema">Tema</button>
      <div class="pills">
        <span class="pill"><span class="pdot" id="aiDot"></span>AI</span>
        <span class="pill"><span class="pdot" id="dkDot"></span>Docker</span>
        <span class="pill" id="ver" title="Versione"></span>
      </div>
    </header>
    <section class="content" id="view"></section>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="ov" id="ov"><div class="modal">
  <div class="mhd"><b id="ovt">Tutorial</b><button class="x" onclick="closeOv()">&times;</button></div>
  <div class="mbody" id="ovc"></div>
</div></div>
<div id="toast"></div>

<script>
let DATA={categories:[],soclab:[]},ST={installed:{},ai:false,docker:false},CUR="dash",CHAT=[],AIMODEL="",AIPERSONA="",ONLYINST=false,CHATQ="";
let CONVS=[],CURCONV=null;
let FAV=[];
try{AIMODEL=localStorage.getItem('cybermodel')||"";}catch(e){}
try{AIPERSONA=localStorage.getItem('cyberpersona')||"";}catch(e){}
try{FAV=JSON.parse(localStorage.getItem('cyberfav')||'[]')||[];}catch(e){FAV=[];}
function isFav(b){return FAV.indexOf(b)>=0;}
function toggleFav(b){const i=FAV.indexOf(b);if(i>=0)FAV.splice(i,1);else FAV.push(b);
  try{localStorage.setItem('cyberfav',JSON.stringify(FAV));}catch(e){}buildNav();render();}
function favTools(){const out=[];DATA.categories.forEach(c=>c.tools.forEach(t=>{if(isFav(t.bin))out.push({t,color:c.color});}));return out;}
const PERSONAS=[{v:'',l:'Modalita: generale'},{v:'redteam',l:'Modalita: Red Team'},{v:'blueteam',l:'Modalita: Blue Team / SOC'},{v:'explain',l:'Modalita: spiega semplice'}];
const QUICK=[
  {l:'Nmap: scansione',q:'Come faccio una scansione completa con nmap di un host? Dammi i comandi pratici.'},
  {l:'SQL injection',q:'Come testo una SQL injection con sqlmap? Comandi ed esempi.'},
  {l:'Crack hash',q:'Come faccio cracking di hash con hashcat e john? Esempi di comando.'},
  {l:'Analisi PCAP',q:'Come analizzo un file pcap con Wireshark/tshark per attivita sospette?'},
  {l:'Privesc Linux',q:'Passi e tool per privilege escalation su Linux in un pentest autorizzato.'},
  {l:'Enum SMB/AD',q:'Come enumero SMB e Active Directory con netexec ed enum4linux-ng?'}
];
async function boot(){
  try{DATA=await (await fetch('tools.json')).json();}catch(e){}
  try{ST=await (await fetch('/api/status')).json();}catch(e){}
  buildNav();render();pills();
}
function pills(){document.getElementById('aiDot').className='pdot'+(ST.ai?' on':'');
  document.getElementById('dkDot').className='pdot'+(ST.docker?' on':'');
  var ve=document.getElementById('ver');if(ve)ve.textContent=ST.version?('v'+ST.version):'';}
function inst(b){return ST.installed&&ST.installed[b];}
function go(v){CUR=v;buildNav();render();closeSide();}
function buildNav(){
  let h=nv('dash','Dashboard','var(--acc)');
  h+=nv('all','Tutti gli strumenti','var(--acc2)',totTools());
  if(FAV.length)h+=nv('fav','Preferiti','#e8c14a',favTools().length);
  h+='<div class="navh">Categorie</div>';
  DATA.categories.forEach((c,i)=>h+=nv('cat:'+i,c.name,c.color,c.tools.length));
  h+='<div class="navh">Laboratorio</div>';
  h+=nv('soc','SOC Lab (SIEM)','#2aa77a',DATA.soclab.length);
  h+=nv('guide','Guide pratiche','#e0a13a',SCEN.length);
  h+=nv('ai','Assistente AI','#d4537e');
  document.getElementById('nav').innerHTML=h;
}
function nv(v,label,col,cnt){const on=CUR===v?' on':'';
  return `<div class="nv${on}" onclick="go('${v}')"><span class="d" style="background:${col}"></span>`+
    `<span style="overflow:hidden;text-overflow:ellipsis">${label}</span>`+(cnt!=null?`<span class="cnt">${cnt}</span>`:'')+`</div>`;}
function totTools(){return DATA.categories.reduce((a,c)=>a+c.tools.length,0);}
function tcard(t,color){const ok=inst(t.bin);
  const first = ok
    ? `<button class="btn go" onclick="launch('${t.bin}')">Avvia</button>`
    : (t.pkg ? `<button class="btn go" onclick="installTool('${t.bin}')">Installa</button>`
             : `<button class="btn go" onclick="launch('${t.bin}')">Avvia</button>`);
  return `<div class="card"><div class="ch"><div class="ic" style="background:${color}">${t.name[0]}</div>`+
    `<div class="nm" title="${t.name}">${t.name}</div><span class="st ${ok?'ok':'no'}">${ok?'ok':'n/d'}</span></div>`+
    `<div class="ds">${t.desc}</div><div class="row">`+
    first+
    `<button class="btn" onclick="showTut('${t.tut}','${t.name}')">Guida</button>`+
    `<button class="btn ai" onclick="askTool('${t.name}')">AI</button>`+
    `<button class="btn" title="Copia il comando" onclick="copyCmd('${t.bin}')">&#10697;</button>`+
    `<button class="btn fav${isFav(t.bin)?' on':''}" title="${isFav(t.bin)?'Togli dai preferiti':'Aggiungi ai preferiti'}" onclick="toggleFav('${t.bin}')">${isFav(t.bin)?'&#9733;':'&#9734;'}</button></div></div>`;}
/* filtro: mostra solo gli strumenti installati */
function toggleInst(){ONLYINST=!ONLYINST;render();}
function filt(tools){return ONLYINST?tools.filter(t=>inst(t.bin)):tools;}
function instBar(){const miss=ST.missing||0;return `<div class="note" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">`+
  `<button class="btn${ONLYINST?' go':''}" onclick="toggleInst()">${ONLYINST?'Mostra tutti':'Solo installati'}</button>`+
  (miss?`<button class="btn go" onclick="installMissing()">Installa i mancanti (${miss})</button>`:'<span style="color:var(--acc2)">Tutto installato &#10003;</span>')+
  `<span style="color:var(--mut)">Filtra le schede e installa con un clic cio' che manca.</span></div>`;}
/* installa in blocco tutti i pacchetti apt mancanti */
async function installMissing(){const n=ST.missing||0;
  if(!n){toast('Nessun pacchetto mancante da installare');return;}
  if(!confirm('Installo '+n+' pacchetti mancanti? Vedrai l\'avanzamento qui sotto.'))return;
  document.getElementById('ovt').textContent='Installazione dei pacchetti mancanti';
  document.getElementById('ovc').innerHTML='<pre id="installlog" style="white-space:pre-wrap;max-height:60vh;overflow:auto;font-size:12px">Avvio...\n</pre>';
  document.getElementById('ov').classList.add('show');
  const pre=document.getElementById('installlog');
  try{
    const resp=await fetch('/api/install_missing_stream',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if(!resp.ok||!resp.body||!resp.body.getReader)throw new Error('nostream');
    const reader=resp.body.getReader(),dec=new TextDecoder();pre.textContent='';
    while(true){const {done,value}=await reader.read();if(done)break;
      pre.textContent+=dec.decode(value,{stream:true});pre.scrollTop=pre.scrollHeight;}
  }catch(e){ // fallback: apre il terminale classico
    pre.textContent+='\n[avvio nel terminale...]\n';
    try{await fetch('/api/install_missing');}catch(_){}}
  try{ST=await (await fetch('/api/status')).json();render();pills();}catch(e){}}
const SCEN=[
  {t:'scenario-primo-pentest',n:'Primo penetration test (web)',d:'Recon, Burp e SQLi su Juice Shop, passo-passo.'},
  {t:'scenario-soc-analyst',n:'Primo turno da SOC Analyst',d:'SIEM, IDS, OSQuery e gestione di un caso.'},
  {t:'scenario-analisi-pcap',n:'Analisi di una cattura (pcap)',d:'tcpdump, Wireshark e Zeek su un pcap.'},
  {t:'scenario-active-directory',n:'Attacco Active Directory',d:'Enumerazione SMB, Responder e BloodHound.'},
  {t:'scenario-wireless',n:'Audit Wi-Fi (la tua rete)',d:'airmon-ng, handshake e aircrack-ng.'},
  {t:'scenario-forensics-memoria',n:'Forensics della memoria (RAM)',d:'Analisi di un dump con Volatility 3.'},
  {t:'scenario-osint',n:'Indagine OSINT su un dominio',d:'theHarvester, subfinder, httpx, SpiderFoot.'},
  {t:'scenario-vuln-assessment',n:'Vulnerability assessment',d:'Nuclei, Nikto e OpenVAS su un bersaglio.'},
  {t:'scenario-malware-analysis',n:'Analisi di un file sospetto',d:'Statica e dinamica sicura: strings, binwalk, radare2, ClamAV.'},
  {t:'scenario-web-api',n:'Test di sicurezza di una API REST',d:'Endpoint, auth/IDOR, nuclei e sqlmap su API autorizzate.'},
  {t:'scenario-log-triage',n:'Triage dei log e threat hunting',d:'auth.log, log web, SIEM e IOC per il SOC.'}
];
function renderGuide(v){
  v.innerHTML='<div class="note">Mini-laboratori guidati: clicca per aprire la guida passo-passo.</div><div class="grid">'+
    SCEN.map(x=>`<div class="card"><div class="ch"><div class="ic" style="background:#e0a13a">${x.n[0]}</div>`+
      `<div class="nm" title="${x.n}">${x.n}</div></div><div class="ds">${x.d}</div>`+
      `<div class="row"><button class="btn go" onclick="showTut('${x.t}','${x.n}')">Apri la guida</button></div></div>`).join('')+'</div>';
}
function render(){const v=document.getElementById('view'),T=document.getElementById('title');
  if(CUR==='dash'){T.textContent='Dashboard';
    const tot=totTools(),ins=Object.values(ST.installed||{}).filter(Boolean).length;
    v.innerHTML=`<div class="metrics">
      <div class="met"><div class="v">${tot}</div><div class="l">Strumenti</div></div>
      <div class="met"><div class="v">${ins}</div><div class="l">Installati</div></div>
      <div class="met"><div class="v">${DATA.categories.length}</div><div class="l">Categorie</div></div>
      <div class="met"><div class="v">${DATA.soclab.length}</div><div class="l">Stack SOC</div></div></div>
      <div class="note" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span>Clicca <b>Avvia</b> per aprire un tool, <b>Guida</b> per il tutorial, <b>AI</b> per una spiegazione. Usa <b>/</b> per cercare.</span>
        ${ST.missing?`<button class="btn go" onclick="installMissing()">Installa i mancanti (${ST.missing})</button>`:'<span style="color:var(--acc2)">Tutti gli strumenti installati &#10003;</span>'}
      </div>
      <div class="sec">Categorie</div><div class="grid">${DATA.categories.map((c,i)=>
        `<div class="card" onclick="go('cat:${i}')" style="cursor:pointer"><div class="ch">
          <div class="ic" style="background:${c.color}">${c.name[0]}</div>
          <div class="nm">${c.name}</div><span class="st ok">${c.tools.length}</span></div>
          <div class="ds">${c.tools.slice(0,4).map(t=>t.name).join(', ')}</div>
          <div class="row"><button class="btn go">Apri categoria</button></div></div>`).join('')}</div>`;
    return;}
  if(CUR==='all'){T.textContent='Tutti gli strumenti';
    const all=DATA.categories.flatMap(c=>filt(c.tools).map(t=>tcard(t,c.color)));
    v.innerHTML=instBar()+'<div class="grid">'+(all.join('')||'<p style="color:var(--mut)">Nessuno strumento installato in questa vista.</p>')+'</div>';return;}
  if(CUR==='fav'){T.textContent='Preferiti';const fv=favTools();
    v.innerHTML='<div class="note">I tuoi strumenti preferiti. Aggiungili o rimuovili con la stella &#9734; sulle schede.</div>'+
      '<div class="grid">'+(fv.map(x=>tcard(x.t,x.color)).join('')||'<p style="color:var(--mut)">Nessun preferito. Clicca la stella su una scheda per aggiungerlo.</p>')+'</div>';return;}
  if(CUR.startsWith('cat:')){const c=DATA.categories[+CUR.split(':')[1]];T.textContent=c.name;
    const cards=filt(c.tools).map(t=>tcard(t,c.color));
    v.innerHTML=instBar()+'<div class="grid">'+(cards.join('')||'<p style="color:var(--mut)">Nessuno strumento installato in questa categoria.</p>')+'</div>';return;}
  if(CUR==='guide'){T.textContent='Guide pratiche — scenari passo-passo';renderGuide(v);return;}
  if(CUR==='soc'){T.textContent='SOC Lab — SIEM & bersagli';
    v.innerHTML='<div class="note">Avvia/ferma gli stack (serve Docker). Al primo avvio scaricano le immagini: ci vuole tempo.</div><div class="grid">'+
      DATA.soclab.map(s=>`<div class="card"><div class="ch"><div class="ic" style="background:#2aa77a">${s.name[0]}</div>
        <div class="nm" title="${s.name}">${s.name}</div><span id="socst-${s.id}" class="st ${SOCST[s.id]?'ok':'no'}">${SOCST[s.id]?'attivo':'spento'}</span></div><div class="ds">${s.desc}</div>
        <div class="row"><button class="btn go" onclick="soc('${s.id}','up')">Avvia</button>
        <button class="btn" onclick="soc('${s.id}','down')">Ferma</button>
        <button class="btn ai" onclick="openLink('${s.url}')">Apri</button></div></div>`).join('')+'</div>';loadSocStatus();return;}
  if(CUR==='ai'){T.textContent='Assistente AI';
    v.innerHTML='<div style="height:100%;display:flex;flex-direction:column">'+
      '<div class="airow">'+
        '<select id="convsel" onchange="switchConv(this.value)" title="Conversazioni"></select>'+
        '<button class="btn" onclick="newConv()" title="Nuova conversazione">+ Nuova</button>'+
        '<button class="btn" onclick="renameConv()" title="Rinomina questa conversazione">Rinomina</button>'+
        '<button class="btn" onclick="deleteConv()" title="Elimina questa conversazione">Elimina</button>'+
        '<select id="aimodel" onchange="setModel(this.value)" title="Scegli il modello AI"></select>'+
        '<select id="aipersona" onchange="setPersona(this.value)" title="Modalita dell\'assistente"></select>'+
        '<button class="btn" onclick="analyzeOutput()" title="Incolla l\'output di un comando da analizzare">Analizza output</button>'+
        '<button class="btn" onclick="exportChat()" title="Scarica la conversazione">Esporta</button>'+
      '</div>'+
      '<div class="airow"><div class="chips" id="chips"></div>'+
        '<input id="chatq" class="chatq" placeholder="Cerca nella chat..." oninput="searchChat(this.value)" value="'+esc(CHATQ)+'"></div>'+
      '<div class="chat" style="flex:1;min-height:0"><div class="msgs" id="msgs"></div>'+
      '<div class="cin"><input id="ai" placeholder="Chiedi qualcosa... (ricordo la conversazione)"><button id="aisend" onclick="sendAI()">Invia</button><button id="aistop" class="btn" onclick="stopAI()" style="display:none" title="Ferma la risposta">Stop</button><button class="btn" onclick="regenAI()" title="Rigenera l\'ultima risposta">Rigenera</button><button class="btn" onclick="clearChat()" title="Svuota questa conversazione">Pulisci</button></div></div></div>';
    buildConvSelect();buildModelSelect();buildPersonaSelect();buildChips();drawChat();
    const i=document.getElementById('ai');i.addEventListener('keydown',e=>{if(e.key==='Enter')sendAI();});i.focus();return;}
}
function drawChat(){const m=document.getElementById('msgs');if(!m)return;
  let list=CHAT;
  if(CHATQ)list=CHAT.filter(x=>x.t&&x.t.toLowerCase().indexOf(CHATQ)>=0);
  const copyBtn='<button class="msgcopy" title="Copia" onclick="copyMsgBtn(this)">&#10697;</button>';
  m.innerHTML=list.map(x=>{
    const body=CHATQ?hlSearch(x.t):((x.r==='a'&&x.t!=='...')?md(x.t):esc(x.t));
    const cp=(x.r==='a'&&x.t&&x.t!=='...')?copyBtn:'';
    return `<div class="m ${x.r}">${body}${cp}</div>`;}).join('')||
    (CHATQ?'<div class="m a">Nessun messaggio trovato per la ricerca.</div>'
          :'<div class="m a">Ciao! Sono CyberAI. Chiedimi come usare un tool, o incolla un output da analizzare. Ricordo le domande precedenti, quindi puoi proseguire la conversazione.</div>');
  if(!CHATQ)m.scrollTop=m.scrollHeight;}
/* ricerca dentro la conversazione */
function searchChat(v){CHATQ=(v||'').toLowerCase();drawChat();}
function hlSearch(t){if(!CHATQ)return esc(t);
  const re=new RegExp('('+CHATQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return esc(t).replace(re,'<mark>$1</mark>');}
function copyMsgBtn(b){const box=b.parentNode.cloneNode(true);const x=box.querySelector('.msgcopy');if(x)x.remove();
  copyText(box.innerText||box.textContent||'');}
/* rinomina la conversazione corrente */
function renameConv(){const c=CONVS.find(x=>x.id===CURCONV);if(!c)return;
  const v=prompt('Nuovo nome della conversazione:',c.title||'');
  if(v===null)return;c.title=(v.trim()||c.title).slice(0,40);saveChat();buildConvSelect();toast('Conversazione rinominata');}
/* selettore del modello AI */
function setModel(v){AIMODEL=v;try{localStorage.setItem('cybermodel',v);}catch(e){}}
function buildModelSelect(){const s=document.getElementById('aimodel');if(!s)return;
  const opts=['','cyberai','llama3.2'].concat((ST.models||[]).filter(m=>['cyberai','llama3.2'].indexOf(m)<0));
  s.innerHTML=opts.map(m=>`<option value="${esc(m)}">${m?('Modello: '+esc(m)):'Modello: automatico'}</option>`).join('');
  s.value=AIMODEL;}
/* chip di domande rapide */
function buildChips(){const c=document.getElementById('chips');if(!c)return;
  c.innerHTML=QUICK.map((x,i)=>`<span class="chip" onclick="quick(${i})">${esc(x.l)}</span>`).join('');}
function quick(i){const x=QUICK[i];if(x)aiSend(x.q);}
/* analizza l'output di un comando incollato dall'utente */
function analyzeOutput(){const o=prompt('Incolla qui l\'output del comando da analizzare:');
  if(o&&o.trim())aiSend('Analizza questo output: spiega cosa significa, evidenzia rischi e vulnerabilita, e indica i prossimi passi pratici.\n\n'+o);}
/* esporta la conversazione in Markdown */
function exportChat(){if(!CHAT.length){toast('Nessuna conversazione da esportare');return;}
  const md=CHAT.filter(x=>x.t&&x.t!=='...').map(x=>(x.r==='u'?'## Tu\n':'## CyberAI\n')+x.t).join('\n\n');
  const blob=new Blob(['# Conversazione CyberAI\n\n'+md+'\n'],{type:'text/markdown'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cyberai-chat.md';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Conversazione esportata');}
/* cronologia inviata all'AI: tutti i messaggi reali (no segnaposto vuoti) */
function chatHistory(){return CHAT.filter(x=>x.t&&x.t!=='...').map(x=>({role:x.r==='u'?'user':'assistant',content:x.t}));}
/* conversazioni multiple, persistenti tra i ricaricamenti */
function cid(){return 'c'+Math.random().toString(36).slice(2,9);}
function convMsgs(){const c=CONVS.find(x=>x.id===CURCONV);return c?c.msgs:[];}
function loadChat(){
  try{const raw=JSON.parse(localStorage.getItem('cyberconvs')||'null');
    if(raw&&Array.isArray(raw.list)&&raw.list.length){CONVS=raw.list;CURCONV=raw.cur;}}catch(e){}
  if(!CONVS.length){ // migra l'eventuale singola chat precedente
    let old=[];try{old=JSON.parse(localStorage.getItem('cyberchat')||'[]')||[];}catch(e){}
    CONVS=[{id:cid(),title:'Conversazione 1',msgs:old}];CURCONV=CONVS[0].id;}
  if(!CURCONV||!CONVS.find(c=>c.id===CURCONV))CURCONV=CONVS[0].id;
  CHAT=convMsgs();}
function saveChat(){const c=CONVS.find(x=>x.id===CURCONV);
  if(c){c.msgs=CHAT.slice(-60);const u=CHAT.find(x=>x.r==='u'&&x.t&&x.t!=='...');if(u)c.title=u.t.slice(0,40);}
  try{localStorage.setItem('cyberconvs',JSON.stringify({list:CONVS.slice(-20),cur:CURCONV}));}catch(e){}}
function newConv(){const c={id:cid(),title:'Nuova conversazione',msgs:[]};CONVS.push(c);CURCONV=c.id;CHAT=c.msgs;CHATQ="";saveChat();render();}
function switchConv(id){CURCONV=id;CHAT=convMsgs();CHATQ="";render();}
function deleteConv(){CONVS=CONVS.filter(c=>c.id!==CURCONV);
  if(!CONVS.length)CONVS=[{id:cid(),title:'Conversazione 1',msgs:[]}];
  CURCONV=CONVS[0].id;CHAT=convMsgs();saveChat();render();toast('Conversazione eliminata');}
function buildConvSelect(){const s=document.getElementById('convsel');if(!s)return;
  s.innerHTML=CONVS.map(c=>`<option value="${c.id}">${esc(c.title||'Senza titolo')}</option>`).join('');s.value=CURCONV;}
/* rigenera l'ultima risposta dell'AI */
function regenAI(){let i=CHAT.length-1;while(i>=0&&CHAT[i].r!=='u')i--;
  if(i<0){toast('Niente da rigenerare');return;}
  const q=CHAT[i].t;CHAT=CHAT.slice(0,i);saveChat();aiSend(q);}
/* modalita' (persona) dell'assistente */
function setPersona(v){AIPERSONA=v;try{localStorage.setItem('cyberpersona',v);}catch(e){}}
function buildPersonaSelect(){const s=document.getElementById('aipersona');if(!s)return;
  s.innerHTML=PERSONAS.map(p=>`<option value="${p.v}">${esc(p.l)}</option>`).join('');s.value=AIPERSONA;}
let AICTRL=null;
function aiBusy(on){const s=document.getElementById('aistop'),b=document.getElementById('aisend');
  if(s)s.style.display=on?'':'none';if(b)b.style.display=on?'none':'';}
function stopAI(){if(AICTRL){try{AICTRL.abort();}catch(e){}}}
async function aiSend(prompt){const hist=chatHistory();
  CHAT.push({r:'u',t:prompt});CHAT.push({r:'a',t:''});drawChat();const idx=CHAT.length-1;
  AICTRL=('AbortController'in window)?new AbortController():null;aiBusy(true);
  try{
    const resp=await fetch('/api/ai_stream',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:prompt,history:hist,model:AIMODEL,persona:AIPERSONA}),signal:AICTRL?AICTRL.signal:undefined});
    if(!resp.ok||!resp.body||!resp.body.getReader)throw new Error('nostream');
    const reader=resp.body.getReader(),dec=new TextDecoder();let acc='';
    while(true){const {done,value}=await reader.read();if(done)break;
      acc+=dec.decode(value,{stream:true});CHAT[idx].t=acc;drawChat();}
    if(!acc.trim())CHAT[idx].t='(nessuna risposta)';
  }catch(e){
    if(e&&e.name==='AbortError'){CHAT[idx].t=(CHAT[idx].t||'')+' [interrotto]';}
    else{ // fallback: endpoint non-streaming
      try{const r=await (await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({prompt:prompt,history:hist,model:AIMODEL,persona:AIPERSONA})})).json();CHAT[idx].t=r.answer;}
      catch(_){CHAT[idx].t='AI non raggiungibile.';}}
  }finally{aiBusy(false);AICTRL=null;drawChat();saveChat();}}
function sendAI(){const i=document.getElementById('ai'),q=i.value.trim();if(!q)return;i.value='';aiSend(q);}
function clearChat(){CHAT.length=0;saveChat();drawChat();const i=document.getElementById('ai');if(i)i.focus();}
function askTool(name){go('ai');aiSend('Spiega come usare '+name+' in cybersecurity con esempi pratici di comando. In italiano.');}
async function launch(bin){const r=await (await fetch('/api/launch?bin='+encodeURIComponent(bin))).json();toast(r.ok?'Avviato: '+bin:'Errore: '+r.msg);}
async function installTool(bin){toast('Installazione di '+bin+'... (apri il terminale e inserisci la password se richiesto)');
  const r=await (await fetch('/api/install?bin='+encodeURIComponent(bin))).json();
  toast(r.ok?('Installazione avviata: '+bin):('Errore: '+r.msg));
  setTimeout(async()=>{try{ST=await (await fetch('/api/status')).json();render();pills();}catch(e){}},20000);}
let SOCST={};
async function loadSocStatus(){try{SOCST=await (await fetch('/api/soclab_status')).json();}catch(e){return;}
  (DATA.soclab||[]).forEach(s=>{const el=document.getElementById('socst-'+s.id);
    if(el){el.className='st '+(SOCST[s.id]?'ok':'no');el.textContent=SOCST[s.id]?'attivo':'spento';}});}
async function soc(id,act){toast('Eseguo '+id+' '+act+'...');
  const r=await (await fetch('/api/soclab',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stack:id,action:act})})).json();toast(r.msg);
  setTimeout(loadSocStatus,8000);}
async function showTut(name,title){document.getElementById('ovt').textContent='Guida: '+(title||name);
  const t=await (await fetch('/api/tutorial?name='+encodeURIComponent(name))).text();
  document.getElementById('ovc').innerHTML=md(t);document.getElementById('ov').classList.add('show');}
function closeOv(){document.getElementById('ov').classList.remove('show');}
/* pannello aiuto e scorciatoie */
function showHelp(){document.getElementById('ovt').textContent='Scorciatoie e aiuto';
  document.getElementById('ovc').innerHTML=
    '<h2>Scorciatoie da tastiera</h2>'+
    '<p><b>/</b> &mdash; vai alla ricerca strumenti</p>'+
    '<p><b>?</b> &mdash; apri questo aiuto</p>'+
    '<p><b>Esc</b> &mdash; chiudi finestre e menu</p>'+
    '<p><b>Invio</b> &mdash; invia la domanda all\'AI</p>'+
    '<h2>Assistente AI</h2>'+
    '<p>Ricorda la conversazione, gestisci piu\' chat, scegli modello e modalita\' '+
    '(Red/Blue Team), rigenera, esporta, cerca nei messaggi e analizza l\'output di un comando.</p>'+
    '<h2>Strumenti</h2>'+
    '<p>Avvia, apri la guida, chiedi all\'AI, copia il comando o aggiungi ai preferiti '+
    'con la stella. Usa &laquo;Installa i mancanti&raquo; per completare la VM con un clic.</p>'+
    '<h2>Comandi nel terminale</h2>'+
    '<p><b>cybermenu</b>, <b>cybergui</b>, <b>ai</b>, <b>ai-explain</b>, <b>cyberdoctor</b>, '+
    '<b>cyberreport</b>, <b>cyberupdate</b>, <b>soclab</b>, <b>cyberhelp</b>.</p>';
  document.getElementById('ov').classList.add('show');}
function md(s){const L=(s||'').split('\n');let h='',c=false;
  const OPEN='<div class="codewrap"><button class="copy" onclick="copyCode(this)">Copia</button><pre>',CLOSE='</pre></div>';
  for(const l of L){if(l.startsWith('```')){h+=c?CLOSE:OPEN;c=!c;continue;}
    if(c){h+=hl(esc(l))+'\n';continue;}
    if(l.startsWith('## '))h+='<h2>'+esc(l.slice(3))+'</h2>';
    else if(l.startsWith('# '))h+='<h1>'+esc(l.slice(2))+'</h1>';
    else if(l.trim())h+='<p>'+esc(l)+'</p>';}
  if(c)h+=CLOSE;return h;}
function copyText(t){t=t||'';
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Copiato'),()=>toast('Copia non riuscita'));return;}
  try{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copiato');}catch(e){toast('Copia non riuscita');}}
function copyCode(b){const pre=b.nextElementSibling;copyText(pre?(pre.innerText||pre.textContent||''):'');}
function findTool(bin){for(const c of DATA.categories)for(const t of c.tools)if(t.bin===bin)return t;return null;}
function copyCmd(bin){const t=findTool(bin);if(t)copyText(t.cmd);}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* evidenziazione leggera per i comandi (input gia' HTML-escaped) */
function hl(line){
  if(/^\s*#/.test(line))return '<span class="c-com">'+line+'</span>';
  line=line.replace(/("[^"]*"|'[^']*')/g,'<span class="c-str">$1</span>');           // stringhe
  line=line.replace(/(^|\s)(--?[a-zA-Z][\w-]*)/g,'$1<span class="c-flag">$2</span>'); // flag/opzioni
  line=line.replace(/\b(\d{1,3}(?:\.\d{1,3}){3}(?:\/\d{1,2})?)\b/g,'<span class="c-num">$1</span>'); // IP/CIDR
  return line;}
function openLink(u){window.open(u,'_blank');}
let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.opacity='1';clearTimeout(tt);tt=setTimeout(()=>e.style.opacity='0',2500);}
function closeSide(){document.getElementById('side').classList.remove('open');document.getElementById('scrim').classList.remove('show');}
document.getElementById('mtoggle').onclick=()=>{document.getElementById('side').classList.toggle('open');document.getElementById('scrim').classList.toggle('show');};
document.getElementById('scrim').onclick=closeSide;
document.getElementById('q').addEventListener('input',e=>{const term=e.target.value.toLowerCase();
  if(!term){render();return;}
  document.getElementById('title').textContent='Risultati: '+term;
  const all=DATA.categories.flatMap(c=>c.tools.map(t=>({t,color:c.color})));
  const f=all.filter(x=>(x.t.name+x.t.desc+x.t.bin).toLowerCase().includes(term));
  const sc=SCEN.filter(x=>(x.n+x.d).toLowerCase().includes(term));
  let html='';
  if(f.length)html+='<div class="sec">Strumenti</div><div class="grid">'+f.map(x=>tcard(x.t,x.color)).join('')+'</div>';
  if(sc.length)html+='<div class="sec">Guide pratiche</div><div class="grid">'+sc.map(x=>
    `<div class="card"><div class="ch"><div class="ic" style="background:#e0a13a">${x.n[0]}</div>`+
    `<div class="nm" title="${x.n}">${x.n}</div></div><div class="ds">${x.d}</div>`+
    `<div class="row"><button class="btn go" onclick="showTut('${x.t}','${x.n}')">Apri la guida</button></div></div>`).join('')+'</div>';
  document.getElementById('view').innerHTML=html||'<p style="color:var(--mut)">Nessun risultato.</p>';});
setInterval(async()=>{try{ST=await (await fetch('/api/status')).json();pills();}catch(e){}},9000);
function applyTheme(t){document.body.classList.toggle('light', t==='light');
  try{localStorage.setItem('cybertheme',t);}catch(e){}
  var b=document.getElementById('theme'); if(b) b.textContent = (t==='light'?'Tema scuro':'Tema chiaro');}
function toggleTheme(){applyTheme(document.body.classList.contains('light')?'dark':'light');}
/* scorciatoie da tastiera: Esc chiude, "/" mette a fuoco la ricerca */
document.addEventListener('keydown',e=>{
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'');
  if(e.key==='Escape'){closeOv();closeSide();}
  else if(e.key==='/'&&!inField){const q=document.getElementById('q');if(q){e.preventDefault();q.focus();}}
  else if(e.key==='?'&&!inField){e.preventDefault();showHelp();}});
try{applyTheme(localStorage.getItem('cybertheme')||'dark');}catch(e){applyTheme('dark');}
loadChat();
boot();
</script>
</body>
